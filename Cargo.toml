[package]
name = "rblas"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A pure-Rust, competitive BLAS implementation (Levels 1-3)"
license = "MIT OR Apache-2.0"
keywords = ["blas", "linear-algebra", "gemm", "simd", "matrix"]
categories = ["mathematics", "science"]

[features]
default = ["std"]
std = []
# Optional multi-threaded GEMM macrokernel (partitions C column-bands over a
# rayon thread pool). Requires `std`.
threads = ["std", "dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# De-facto pure-Rust GEMM baseline (the engine behind ndarray's `dot`).
# Single-threaded, f32/f64, SIMD microkernels — the right apples-to-apples bar.
matrixmultiply = "0.3"

[[bench]]
name = "gemm"
harness = false

[[bench]]
name = "level1"
harness = false

[[bench]]
name = "compare"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
